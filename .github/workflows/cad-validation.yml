name: Ori CAD validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Static repository audit
        run: python Source/CAD/validation/repo_audit.py

      - name: Install CAD dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r Source/requirements.txt

      - name: CAD smoke build
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "Source/CAD/Master")
          sys.path.insert(0, "Source/CAD")
          from build_common import size_of
          from Legs.master_leg import make_leg_assembly
          from Torso.torso import make_torso
          from Head.head import make_head
          from Arm.arm import make_arm
          from Assemblies.assembly import make_robot

          _arm_parts, arm_compound = make_arm()
          checks = [
              ("leg", make_leg_assembly(export_parts=False)["upper_link"]),
              ("torso", make_torso(export_parts=False)["full"]),
              ("head", make_head(export_parts=False)["full"]),
              ("arm", arm_compound),
              ("robot", make_robot(export_parts=False, merged=False)["full"]),
          ]
          for name, part in checks:
              dims = size_of(part)
              assert all(d > 0 for d in dims), f"{name} has invalid bounds: {dims}"
              print(name, "OK", tuple(round(d, 2) for d in dims))
          print("CAD SMOKE BUILD: PASS")
          PY

      - name: Leg validation
        run: python Validation_and_Docs/Validation/validate_leg.py

      - name: Robot validation
        run: python Validation_and_Docs/Validation/validate_robot.py

      - name: Wrist validation
        run: python Validation_and_Docs/Validation/validate_wrist.py

      - name: Load analysis
        run: python Validation_and_Docs/Validation/analyze_loads.py

      - name: Shaft analysis
        run: python Validation_and_Docs/Validation/analyze_shafts.py

      - name: Arm/wrist load analysis
        run: python Validation_and_Docs/Validation/analyze_arm_wrist.py
